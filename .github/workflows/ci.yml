name: ci

on:
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: usd
          POSTGRES_PASSWORD: usd
          POSTGRES_DB: usd_kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usd -d usd_kb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      REDIS_URL: redis://127.0.0.1:6379
      POSTGRES_URL: postgresql://usd:usd@127.0.0.1:5432/usd_kb
      JIRA_WEBHOOK_SECRET: ci-test-secret
      HD_WEBHOOK_SECRET: ci-test-secret
      JIRA_DEFAULT_ORG_ID: demo-org
      HD_DEFAULT_ORG_ID: demo-org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for service ports
        shell: bash
        run: |
          set -euo pipefail
          for port in 8000 6379 5432; do
            ready=0
            for _ in $(seq 1 60); do
              if bash -c "echo > /dev/tcp/127.0.0.1/${port}" 2>/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [[ "${ready}" != "1" ]]; then
              echo "Timeout waiting for port ${port}"
              exit 1
            fi
          done

      - name: KB migrate
        run: pnpm --filter @usd/api kb:migrate

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
